name: fetch-daily

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = setelah market close US, hari kerja
  workflow_dispatch:           # bisa dipicu manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: fetch-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch universe + bars
        run: python -m jobs.job_fetch_daily --limit 600 --years 3

      - name: Commit data
        run: |
          git config user.name "gsai-bot"
          git config user.email "gsai-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: fetch harian $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
